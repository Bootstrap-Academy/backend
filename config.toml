[http]
# address = "0.0.0.0:80"
# Read the client ip from a header set by the reverse proxy. `set_from` is
# required: the header is only trusted when the request actually comes from
# that address, so a client cannot choose its own ip.
# real_ip = { header = "X-Real-Ip", set_from = "127.0.0.1" }
allowed_origins = []

[database]
# url = "" # https://docs.rs/tokio-postgres/latest/tokio_postgres/config/struct.Config.html
max_connections = 10
min_connections = 0
acquire_timeout = "10s"
idle_timeout = "10m"
max_lifetime = "30m"
run_migrations = true

[cache]
# url = "" # https://docs.rs/redis/latest/redis/#connection-parameters
max_connections = 10
min_connections = 0
acquire_timeout = "10s"
idle_timeout = "10m"
max_lifetime = "30m"

[email]
# smtp_url = "" # https://docs.rs/lettre/latest/lettre/transport/smtp/struct.AsyncSmtpTransport.html#method.from_url
# from = ""

[jwt]
# secret = ""
download_token_ttl = "10m"

[internal]
jwt_ttl = "10s"

# Secrets for the internal service tokens, one per audience. An audience which
# is missing here falls back to `jwt.secret`, so the shared secret stays in use
# until a dedicated one is deployed to every sender and to the receiver.
[internal.secrets]
# auth = ""
# shop = ""
# skills = ""
# challenges = ""
# events = ""

[health]
database_cache_ttl = "10s"
cache_cache_ttl = "10s"
email_cache_ttl = "10s"

[user]
# Version of the terms and conditions that is currently in force. Only this
# version can be accepted, and it is the value that is recorded.
terms_version = "2026-09"
name_change_rate_limit = "30d"
export_rate_limit = "10m"
verification_code_ttl = "4h"
verification_redirect_url = "https://bootstrap.academy/auth/verify-account"
password_reset_code_ttl = "4h"
password_reset_redirect_url = "https://bootstrap.academy/auth/reset-password"

[session]
access_token_ttl = "5m"
refresh_token_ttl = "30d"
refresh_token_length = 64
login_fails_before_captcha = 3

[totp]
secret_length = 32

[contact]
# email = ""

[contract]
# Rate limits of the declaration endpoints (`POST /contracts/cancellations` and
# `POST /contracts/withdrawals`), counted per client ip address and per email
# address over the same window.
#
# The per-ip budget only exists to stop one machine from flooding the endpoint.
# It has to stay far above what a household, a school or a carrier-grade NAT
# produces, because everybody behind such an address shares it and § 312k Abs. 2
# BGB requires the cancellation form to be permanently available. The per-email
# budget is the tighter one: nobody declares the same contract five times an
# hour.
rate_limit_window = "1h"
rate_limit_per_ip = 60
rate_limit_per_email = 5

[recaptcha]
enable = true
# siteverify_endpoint_override = ""
# sitekey = ""
# secret = ""
min_score = 0.5

[vat]
# validate_endpoint_override = ""

[paypal]
# base_url_override = ""
# client_id = ""
# client_secret = ""

[coin]
purchase_min = 500
purchase_max = 1000000

[heart]
max = 6
refill_price = 50
auto_refill_time = "00:00" # UTC

[premium]
monthly_price = 1000
yearly_price = 10000

[render]
# daemon_url = ""

[microservices]
# skills_url = ""
# challenges_url = ""
# events_url = ""
timeout = "10s"
export_timeout = "30s"
max_export_size = 33554432 # 32 MiB per service

[finance]
vat_percent = 19
# Invoices, credit notes and final statements are kept for eight years,
# counted from the end of the calendar year in which they were issued
# (§ 147 Abs. 3 Satz 1 und Abs. 4 AO, § 257 Abs. 4 HGB, § 14b Abs. 1 UStG).
# Enforced by `academy task prune-documents`.
retention_years = 8
# invoices_archive = ""
# credit_notes_archive = ""
# final_statements_archive = ""

# [sentry]
# enable = true
# dsn = ""

[oauth2]
enable = true
registration_token_ttl = "10m"
# how long a started authorization flow can be completed; only has to cover the
# round trip through the provider's consent screen
authorization_ttl = "10m"

[oauth2.providers.github]
enable = true
pkce = true
name = "GitHub"
# client_id = ""
# client_secret = ""
auth_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
userinfo_url = "https://api.github.com/user"
userinfo_id_key = "id"
userinfo_name_key = "login"
scopes = []

[oauth2.providers.discord]
enable = true
pkce = true
name = "Discord"
# client_id = ""
# client_secret = ""
auth_url = "https://discord.com/oauth2/authorize"
token_url = "https://discord.com/api/oauth2/token"
userinfo_url = "https://discord.com/api/users/@me"
userinfo_id_key = "id"
userinfo_name_key = "username"
scopes = ["identify"]

[oauth2.providers.google]
enable = true
pkce = true
name = "Google"
# client_id = ""
# client_secret = ""
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://www.googleapis.com/oauth2/v3/token"
userinfo_url = "https://www.googleapis.com/oauth2/v3/userinfo"
userinfo_id_key = "sub"
userinfo_name_key = "given_name"
scopes = ["openid", "profile"]
