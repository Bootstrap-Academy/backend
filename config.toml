[http]
# address = "0.0.0.0:80"
# real_ip = { header = "X-Real-Ip", set_from = "127.0.0.1" }
allowed_origins = []

[database]
# url = "" # https://docs.rs/tokio-postgres/latest/tokio_postgres/config/struct.Config.html
max_connections = 10
min_connections = 0
acquire_timeout = "10s"
idle_timeout = "10m"
max_lifetime = "30m"
run_migrations = true

[cache]
# url = "" # https://docs.rs/redis/latest/redis/#connection-parameters
max_connections = 10
min_connections = 0
acquire_timeout = "10s"
idle_timeout = "10m"
max_lifetime = "30m"

[email]
# smtp_url = "" # https://docs.rs/lettre/latest/lettre/transport/smtp/struct.AsyncSmtpTransport.html#method.from_url
# from = ""

[jwt]
# secret = ""
download_token_ttl = "10m"

[internal]
jwt_ttl = "10s"

# Secrets for the internal service tokens, one per audience. An audience which
# is missing here falls back to `jwt.secret`, so the shared secret stays in use
# until a dedicated one is deployed to every sender and to the receiver.
[internal.secrets]
# auth = ""
# shop = ""
# skills = ""
# challenges = ""
# events = ""

[health]
database_cache_ttl = "10s"
cache_cache_ttl = "10s"
email_cache_ttl = "10s"

[user]
name_change_rate_limit = "30d"
export_rate_limit = "10m"
verification_code_ttl = "4h"
verification_redirect_url = "https://bootstrap.academy/auth/verify-account"
password_reset_code_ttl = "4h"
password_reset_redirect_url = "https://bootstrap.academy/auth/reset-password"

[session]
access_token_ttl = "5m"
refresh_token_ttl = "30d"
refresh_token_length = 64
login_fails_before_captcha = 3

[totp]
secret_length = 32

[contact]
# email = ""

[recaptcha]
enable = true
# siteverify_endpoint_override = ""
# sitekey = ""
# secret = ""
min_score = 0.5

[vat]
# validate_endpoint_override = ""

[paypal]
# base_url_override = ""
# client_id = ""
# client_secret = ""

[coin]
purchase_min = 500
purchase_max = 1000000

[heart]
max = 6
refill_price = 50
auto_refill_time = "00:00" # UTC

[premium]
monthly_price = 1000
yearly_price = 10000

[render]
# daemon_url = ""

[microservices]
# skills_url = ""
# challenges_url = ""
# events_url = ""
timeout = "10s"
export_timeout = "30s"
max_export_size = 33554432 # 32 MiB per service

[finance]
vat_percent = 19
# invoices_archive = ""
# credit_notes_archive = ""

# [sentry]
# enable = true
# dsn = ""

[oauth2]
enable = true
registration_token_ttl = "10m"

[oauth2.providers.github]
enable = true
name = "GitHub"
# client_id = ""
# client_secret = ""
auth_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
userinfo_url = "https://api.github.com/user"
userinfo_id_key = "id"
userinfo_name_key = "login"
scopes = []

[oauth2.providers.discord]
enable = true
name = "Discord"
# client_id = ""
# client_secret = ""
auth_url = "https://discord.com/oauth2/authorize"
token_url = "https://discord.com/api/oauth2/token"
userinfo_url = "https://discord.com/api/users/@me"
userinfo_id_key = "id"
userinfo_name_key = "username"
scopes = ["identify"]

[oauth2.providers.google]
enable = true
name = "Google"
# client_id = ""
# client_secret = ""
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://www.googleapis.com/oauth2/v3/token"
userinfo_url = "https://www.googleapis.com/oauth2/v3/userinfo"
userinfo_id_key = "sub"
userinfo_name_key = "given_name"
scopes = ["openid", "profile"]
